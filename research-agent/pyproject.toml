[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent research crew built on CrewAI."
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.12.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
